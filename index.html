<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gynecology Checklist</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;padding:20px;max-width:700px;margin:auto}
h1{text-align:center;color:#1565c0}
.section{background:#fff;padding:15px;border-radius:10px;margin-top:20px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
label{display:block;padding:8px;font-size:18px;cursor:pointer}
progress{width:100%;height:25px}
#percent{font-size:20px;text-align:center;font-weight:bold;color:#1565c0;margin:10px 0}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:999}
#popup{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
background:#fff;padding:25px 40px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.3);
font-size:38px;font-weight:bold;z-index:1000}
#close{position:absolute;top:8px;right:12px;font-size:28px;cursor:pointer}
canvas{display:none;position:fixed;inset:0;pointer-events:none;z-index:998}
</style>
</head>
<body>
<canvas id="fw"></canvas>
<div id="overlay"></div>
<div id="popup"><span id="close">&times;</span>🏆 عااش يا باشا 🔥</div>

<h1>📚 Gynecology Checklist</h1>
<div id="percent">0%</div>
<progress id="progress" max="100"></progress>

<div class="section">
<h2>Part I</h2>
<label><input type="checkbox"> Anatomy</label>
<label><input type="checkbox"> Embryology</label>
<label><input type="checkbox"> Physiology</label>
<label><input type="checkbox"> Puberty & Menopause</label>
<label><input type="checkbox"> Anovulation</label>
<label><input type="checkbox"> Amenorrhea</label>
<label><input type="checkbox"> Endometriosis</label>
<label><input type="checkbox"> Infertility</label>
<label><input type="checkbox"> Menstrual Disorders</label>
<label><input type="checkbox"> STDs</label>
<label><input type="checkbox"> Lower GTI</label>
<label><input type="checkbox"> Upper GTI</label>
<label><input type="checkbox"> Chronic Granulomatous Lesions</label>
<label><input type="checkbox"> Basics of Urogynecology</label>
<label><input type="checkbox"> SUI</label>
<label><input type="checkbox"> Urogenital Fistula</label>
<label><input type="checkbox"> Rectovaginal Fistula</label>
<label><input type="checkbox"> Genital Prolapse</label>
<h2>Part II</h2>
<label><input type="checkbox"> GTN</label>
<label><input type="checkbox"> Uterine Fibroid</label>
<label><input type="checkbox"> Premalignant Lesions</label>
<label><input type="checkbox"> Endometrial Carcinoma</label>
<label><input type="checkbox"> Cervical Carcinoma</label>
<label><input type="checkbox"> Ovarian Tumors</label>
<label><input type="checkbox"> Contraception</label>
<label><input type="checkbox"> Operative Gynecology</label>
<label><input type="checkbox"> Differential Diagnosis</label>
</div>

<script>
const boxes=[...document.querySelectorAll("input[type=checkbox]")];
let celebrated=false;
boxes.forEach((b,i)=>{
 b.checked=localStorage.getItem("lesson"+i)==="true";
 b.onchange=()=>{localStorage.setItem("lesson"+i,b.checked);update();}
});
document.getElementById("close").onclick=()=>{
 popup.style.display="none";
 overlay.style.display="none";
 fw.style.display="none";
}
const popup=document.getElementById("popup");
const overlay=document.getElementById("overlay");
const fw=document.getElementById("fw");
const ctx=fw.getContext("2d");

function launch(){
 fw.width=innerWidth; fw.height=innerHeight; fw.style.display="block";
 let p=[];
 for(let k=0;k<10;k++){
   let x=Math.random()*fw.width,y=80+Math.random()*fw.height*0.5;
   for(let i=0;i<70;i++){
      let a=Math.random()*Math.PI*2,s=Math.random()*5+2;
      p.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:80});
   }
 }
 (function anim(){
   ctx.clearRect(0,0,fw.width,fw.height);
   for(let i=p.length-1;i>=0;i--){
      let q=p[i];
      q.x+=q.vx;q.y+=q.vy;q.vy+=0.04;q.l--;
      ctx.fillStyle=`hsl(${q.l*5},100%,60%)`;
      ctx.beginPath();ctx.arc(q.x,q.y,2,0,6.3);ctx.fill();
      if(q.l<=0)p.splice(i,1);
   }
   if(p.length)requestAnimationFrame(anim); else fw.style.display="none";
 })();
}
function beep(){
 const a=new(AudioContext||webkitAudioContext)();
 const o=a.createOscillator(),g=a.createGain();
 o.connect(g);g.connect(a.destination);o.frequency.value=700;
 g.gain.setValueAtTime(.2,a.currentTime);
 g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+0.7);
 o.start();o.stop(a.currentTime+0.7);
}
function update(){
 const done=boxes.filter(x=>x.checked).length;
 const per=Math.round(done/boxes.length*100);
 progress.value=per;
 percent.textContent=per+"% Completed";
 if(per===100 && !celebrated){
   celebrated=true;
   overlay.style.display="block";
   popup.style.display="block";
   launch();
   try{beep();}catch(e){}
 }
 if(per<100)celebrated=false;
}
update();
</script>
</body></html>
